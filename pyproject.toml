[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recordlint"
version = "1.2.0"
description = "RecordLint（质录检）：扫描件质量记录填写规范自动预审，输出疑点清单供人工终审"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.8",
    "rapidocr-onnxruntime>=1.3",
    "onnxruntime>=1.16",
    "PyMuPDF>=1.23",
    "numpy>=1.24",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# 仅训练用；推理侧只用 numpy，部署不需要装
train = ["scikit-learn>=1.3"]

[project.scripts]
qaudit = "qaudit.cli:main"

[tool.setuptools]
packages = ["qaudit", "qaudit.web", "qaudit.web.views", "qaudit.train"]

[tool.setuptools.package-data]
qaudit = ["../config/rules.yaml"]
"qaudit.web" = ["static/*.css", "static/*.js", "static/vendor/*.js"]
